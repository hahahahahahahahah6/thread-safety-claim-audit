[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thread-safety-claim-audit"
version = "0.1.0"
description = "Offline audit of documented thread-safety claims against Python source."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
thread-safety-claim-audit = "thread_safety_claim_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
